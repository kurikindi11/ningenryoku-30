<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人間力30日">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>人間力30日計画</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: phone app. summary card, sticky day strip, one day at a time (知識3分 / 実践5分 / 内省2分), notes, backup */
:root {
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F2F4F8; --surface: #FFFFFF; --fg: #18202F; --muted: #586277; --line: #DCE1EA;
  --accent: #2D4AA8; --on-accent: #FFFFFF; --track: #DDE3EE; --now: #D98A00; --danger: #B3391F; --ok: #0E7A52;
  --t-sci: #E4F4F1; --x-sci: #0A5A50;
  --t-hist: #FBF0DC; --x-hist: #6E4500;
  --t-view: #EEEBFA; --x-view: #382C86;
  --t-chk: #FBEAE5; --x-chk: #7F2A18;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E121A; --surface: #161B26; --fg: #E7EBF3; --muted: #98A2B6; --line: #262E3D;
    --accent: #8FA5F5; --on-accent: #0E121A; --track: #262E3D; --now: #F0B03A; --danger: #F08A70; --ok: #5CCB9C;
    --t-sci: #12302C; --x-sci: #A5E6DB;
    --t-hist: #33270F; --x-hist: #F3D699;
    --t-view: #211E3B; --x-view: #CEC8F9;
    --t-chk: #37201A; --x-chk: #F8C4B6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E121A; --surface: #161B26; --fg: #E7EBF3; --muted: #98A2B6; --line: #262E3D;
  --accent: #8FA5F5; --on-accent: #0E121A; --track: #262E3D; --now: #F0B03A; --danger: #F08A70; --ok: #5CCB9C;
  --t-sci: #12302C; --x-sci: #A5E6DB;
  --t-hist: #33270F; --x-hist: #F3D699;
  --t-view: #211E3B; --x-view: #CEC8F9;
  --t-chk: #37201A; --x-chk: #F8C4B6;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.75; padding-bottom: 56px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
.inner { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
p { margin: 0; overflow-wrap: anywhere; }

.hero { padding-block: 20px 14px; }
.hero h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
.hero .sub { margin: 2px 0 14px; color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.stat { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.big { font-size: 44px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
.big small { font-size: 18px; font-weight: 500; margin-left: 4px; color: var(--muted); }
.stat-r { text-align: right; font-size: 14px; color: var(--muted); min-width: 0; }
.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 14px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.btn { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px; padding: 0 18px; }
.startbtn { margin-top: 14px; width: 100%; }

.stripwrap { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 8px; }
.strip { position: relative; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.chip { position: relative; flex: none; width: 44px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; display: grid; place-items: center; padding: 0; }
.chip.part { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; }
.chip.full { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: currentColor; }
.chip .todaydot { position: absolute; top: 4px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--now); }

.dayhead { padding-block: 18px 4px; }
.phase { font-size: 13px; color: var(--muted); }
.dayhead h2 { margin: 2px 0 0; font-size: 20px; font-weight: 700; text-wrap: balance; }
.dayhead .state { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--accent); }
.future { margin-top: 8px; font-size: 13px; color: var(--muted); padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; }
.step { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.sh { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 0; }
.sh b { font-size: 15px; font-weight: 700; }
.sh span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sb { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ks h4 { margin: 0 0 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; line-height: 1.7; letter-spacing: 0; }
.tag.sci { background: var(--t-sci); color: var(--x-sci); }
.tag.hist { background: var(--t-hist); color: var(--x-hist); }
.tag.view { background: var(--t-view); color: var(--x-view); }
.tag.chk { background: var(--t-chk); color: var(--x-chk); }
.vn { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--t-chk); color: var(--x-chk); font-size: 14px; line-height: 1.65; }
.vn b { font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }

.ask { font-weight: 700; font-size: 15px; }
.field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.field small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
textarea { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); line-height: 1.6; font-size: 16px; }
.saved { font-size: 12px; color: var(--muted); min-height: 1.2em; }
.done { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; border: 0; border-top: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 16px; }
.done::before { content: ""; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); flex: none; }
.done[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.done[aria-pressed="true"]::before { content: "✓"; display: grid; place-items: center; font-size: 15px; line-height: 1; font-weight: 700; border-color: var(--on-accent); background: var(--on-accent); color: var(--accent); }

.check { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; border-top: 1px solid var(--line); }
.check h4 { margin: 10px 0 0; font-size: 14px; font-weight: 700; }
.ci .cl { font-size: 15px; font-weight: 700; }
.ci .ch { font-size: 13px; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 6px 0; }
.scale button { min-height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.scale-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.ci input[type="text"] { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; margin-top: 6px; }

.compare { display: flex; flex-direction: column; gap: 14px; padding: 14px; border-radius: 12px; background: var(--bg); }
.compare h4 { margin: 0; font-size: 15px; font-weight: 700; }
.cmp .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.cmp .delta { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cmp .delta.up { color: var(--ok); }
.cmp .delta.down { color: var(--danger); }
.cmp .rows { display: grid; grid-template-columns: 52px minmax(0, 1fr) 20px; gap: 4px 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp .mb { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.cmp .mb i { display: block; height: 100%; border-radius: 999px; background: var(--muted); }
.cmp .mb.now i { background: var(--accent); }
.cmp .nts { margin-top: 6px; font-size: 13px; color: var(--muted); }
.cmp .nts p + p { margin-top: 2px; }

.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.navbtn { min-height: 48px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 15px; font-weight: 500; }
.navbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.navbtn:disabled { opacity: .4; cursor: default; }

.sec { margin-top: 32px; }
.sec h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.note { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.note .nh { font-size: 13px; color: var(--muted); }
.note .nt { margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 15px; }
.empty { font-size: 14px; color: var(--muted); }

.backup { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.ghost { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 14px; font-weight: 500; }
.ghost.sm { background: transparent; color: var(--muted); }
.filebtn { position: relative; display: inline-flex; align-items: center; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.msg { font-size: 14px; }
.msg.err { color: var(--danger); font-weight: 700; }
.msg.ok { color: var(--ok); font-weight: 700; }
.preview { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--accent); display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.preview dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; }
.preview dt { color: var(--muted); }
.preview dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.danger { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--danger); color: #fff; font-weight: 700; font-size: 14px; }
:root:not([data-theme="light"]) .danger { color: #fff; }
.foot { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.fnote { font-size: 13px; color: var(--muted); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="hero">
  <div class="inner">
    <h1>人間力30日計画</h1>
    <p class="sub">1日10分　知識3分・実践5分・内省2分</p>
    <div class="card">
      <div class="stat">
        <div class="big"><span id="pct">0</span><small>%</small></div>
        <div class="stat-r"><div>完了 <b id="days">0</b> / 30日</div><div id="today"></div></div>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-label="全体の進捗" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
      <button class="btn startbtn" id="startbtn" type="button">今日からスタートする</button>
    </div>
  </div>
</header>
<nav class="stripwrap" aria-label="日付の切り替え"><div class="inner"><div class="strip" id="strip"></div></div></nav>
<main class="inner">
  <article id="day"></article>

  <section class="sec" aria-labelledby="nh">
    <h3 id="nh">これまでの内省</h3>
    <div id="notes"></div>
  </section>

  <section class="sec" aria-labelledby="bh">
    <h3 id="bh">記録のバックアップ</h3>
    <div class="backup">
      <p class="fnote">記録はこのスマホの中だけに保存されます。機種変更やブラウザのデータ削除に備えて、ときどき書き出してください。</p>
      <div class="row">
        <button class="ghost" id="exportbtn" type="button">ファイルに書き出す</button>
        <button class="ghost" id="copybtn" type="button">テキストでコピー</button>
      </div>
      <textarea id="copybox" rows="3" readonly hidden aria-label="バックアップのテキスト"></textarea>
      <div class="row">
        <label class="ghost filebtn">ファイルから復元<input type="file" id="importfile" accept=".json,application/json,text/plain"></label>
        <button class="ghost" id="pastebtn" type="button">貼り付けて復元</button>
      </div>
      <div id="pastearea" hidden>
        <textarea id="pastebox" rows="4" placeholder="書き出したテキストを貼り付け" aria-label="復元するテキスト"></textarea>
        <div class="row" style="margin-top:8px"><button class="ghost" id="pastego" type="button">読み込む</button></div>
      </div>
      <p class="msg" id="bmsg" aria-live="polite"></p>
      <div class="preview" id="preview" hidden>
        <b>この内容で復元しますか？　今の記録はすべて上書きされます。</b>
        <dl id="pvlist"></dl>
        <div class="row">
          <button class="danger" id="restoreyes" type="button">上書きして復元</button>
          <button class="ghost" id="restoreno" type="button">やめる</button>
        </div>
      </div>
    </div>
  </section>

  <div class="foot">
    <p class="fnote" id="fnote">ホーム画面に追加して使うと、保存が安定します。</p>
    <button class="ghost sm" id="resetbtn" type="button">最初からやり直す</button>
    <div class="confirm" id="resetconfirm" hidden>
      <span>チェック・内省・採点をすべて消します。</span>
      <button class="danger" id="resetyes" type="button">リセットする</button>
      <button class="ghost" id="resetno" type="button">やめる</button>
    </div>
  </div>
</main>

<script src="days.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'ningenryoku30:v3', OLD = 'ningenryoku30:v2';
  var TAGS = { sci: '科学的根拠あり', hist: '歴史的事実', view: '講師の独自見解', chk: '要検証' };
  var PH = [['1週目', '自分を観察する'], ['2週目', '過去と親子'], ['3週目', '人間関係と対話'], ['4週目', '社会と環境'], ['最終', '使命と表現']];
  var STEPS = [{ id: 'k', name: '知識', min: 3, verb: '読んだ' }, { id: 'a', name: '実践', min: 5, verb: 'やった' }, { id: 'r', name: '内省', min: 2, verb: '記録した' }];
  var REFL = [
    { k: 'g', t: '今日気づいたこと', h: '新しく分かったこと、自分について発見したこと' },
    { k: 'c', t: '変えたいこと', h: '考え方や行動で変えたいこと' },
    { k: 'n', t: '明日やること', h: '具体的な行動を1つ' }
  ];
  var CHECK = [
    { k: 'emo', t: '自分の感情への理解', h: '感情に気づき、名前をつけられる' },
    { k: 'rel', t: '親子・人間関係への向き合い方', h: '過去や相手と、落ち着いて向き合える' },
    { k: 'soc', t: '社会や教育の見方', h: '情報をうのみにせず、自分で確かめられる' },
    { k: 'pur', t: '自分の人生の目的', h: '何のために生きるか、言葉にできる' },
    { k: 'hab', t: '続けたい行動', h: '続けたい行動がはっきりしていて、できている' }
  ];

  var state = blank();
  var sel = 1, storageOk = true, saveT = null, savedT = null, pending = null;

  function blank() { return { start: null, done: {}, refl: {}, base: { d1: null, d30: null } }; }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dayNumber() {
    if (!state.start) return 0;
    var s = new Date(state.start + 'T00:00:00'), n = new Date(); n.setHours(0, 0, 0, 0);
    return Math.floor((n - s) / 86400000) + 1;
  }
  function todayNum() { var n = dayNumber(); return state.start && n >= 1 && n <= 30 ? n : 0; }
  function dayCount(d) { var n = 0; STEPS.forEach(function (s) { if (state.done[d + s.id]) n++; }); return n; }
  function hasRefl(d) { var r = state.refl[d]; return !!(r && (r.g || r.c || r.n)); }

  /* ---------- 検証（読み込み・復元の両方で使う） ---------- */
  function str(v, max) { return typeof v === 'string' ? v.slice(0, max) : ''; }
  function sanitize(o) {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    var out = blank(), k;
    if (o.start != null) {
      if (typeof o.start !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(o.start) || isNaN(new Date(o.start + 'T00:00:00'))) return null;
      out.start = o.start;
    }
    if (o.done != null) {
      if (typeof o.done !== 'object' || Array.isArray(o.done)) return null;
      for (k in o.done) if (/^([1-9]|[12]\d|30)[kar]$/.test(k) && o.done[k]) out.done[k] = 1;
    }
    if (o.refl != null) {
      if (typeof o.refl !== 'object' || Array.isArray(o.refl)) return null;
      for (k in o.refl) {
        if (!/^([1-9]|[12]\d|30)$/.test(k)) continue;
        var r = o.refl[k]; if (!r || typeof r !== 'object') continue;
        var c = { g: str(r.g, 4000), c: str(r.c, 4000), n: str(r.n, 4000) };
        if (c.g || c.c || c.n) out.refl[k] = c;
      }
    }
    if (o.base != null) {
      if (typeof o.base !== 'object' || Array.isArray(o.base)) return null;
      ['d1', 'd30'].forEach(function (w) {
        var b = o.base[w]; if (!b || typeof b !== 'object') return;
        var s = {}, n = {}, any = false;
        CHECK.forEach(function (c) {
          var v = b.s && b.s[c.k];
          if (Number.isInteger(v) && v >= 1 && v <= 5) { s[c.k] = v; any = true; }
          var t = str(b.n && b.n[c.k], 500); if (t) { n[c.k] = t; any = true; }
        });
        if (any) out.base[w] = { s: s, n: n };
      });
    }
    return out;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = sanitize(JSON.parse(raw)); if (s) state = s; return; }
      var old = JSON.parse(localStorage.getItem(OLD) || 'null');
      if (old && typeof old === 'object') {
        var m = { start: old.start, done: old.done, refl: {} };
        if (old.notes && typeof old.notes === 'object') for (var d in old.notes) m.refl[d] = { g: old.notes[d] };
        var s2 = sanitize(m); if (s2) { state = s2; saveNow(); }
      }
    } catch (e) { storageOk = false; }
  }
  function saveNow() {
    clearTimeout(saveT);
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { storageOk = false; $('fnote').textContent = 'この環境では保存できません。ブラウザの設定を確認してください。'; return false; }
  }
  function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
  function flashSaved() {
    var s = $('savedmsg'); if (!s) return;
    s.textContent = '保存中…'; clearTimeout(savedT);
    savedT = setTimeout(function () { saveNow(); s.textContent = storageOk ? '自動で保存しました' : '保存できませんでした'; }, 400);
  }

  /* ---------- 上部 ---------- */
  function buildStrip() {
    var s = $('strip'); s.textContent = '';
    for (var d = 1; d <= 30; d++) {
      (function (d) {
        var b = el('button', 'chip'); b.type = 'button'; b.dataset.d = d;
        b.appendChild(el('span', null, String(d)));
        var dot = el('span', 'todaydot'); dot.hidden = true; dot.setAttribute('aria-hidden', 'true'); b.appendChild(dot);
        b.addEventListener('click', function () { selectDay(d, true); });
        s.appendChild(b);
      })(d);
    }
  }
  function updateStrip() {
    var today = todayNum();
    document.querySelectorAll('.chip').forEach(function (b) {
      var d = +b.dataset.d, c = dayCount(d);
      b.className = 'chip' + (c === 3 ? ' full' : c > 0 ? ' part' : '');
      b.setAttribute('aria-selected', d === sel ? 'true' : 'false');
      b.setAttribute('aria-label', 'Day ' + d + '　' + c + '/3' + (d === today ? '　今日' : ''));
      b.querySelector('.todaydot').hidden = d !== today;
    });
    var s = $('strip'), cur = s.children[sel - 1];
    if (cur) s.scrollLeft = cur.offsetLeft - (s.clientWidth - cur.offsetWidth) / 2;
  }
  function updateSummary() {
    var steps = 0, days = 0;
    for (var d = 1; d <= 30; d++) { var c = dayCount(d); steps += c; if (c === 3) days++; }
    var pct = Math.round(steps / 90 * 100);
    $('pct').textContent = pct; $('days').textContent = days;
    $('fill').style.width = pct + '%'; $('bar').setAttribute('aria-valuenow', pct);
    $('startbtn').hidden = !!state.start;
    var n = dayNumber();
    $('today').textContent = !state.start ? '未スタート' : days === 30 ? '30日、完走です' : n > 30 ? '30日が経過しました' : '今日は Day ' + Math.max(1, n);
  }

  /* ---------- 1日の画面 ---------- */
  function tagEl(t) { return el('span', 'tag ' + t, TAGS[t]); }
  function kSection(h, text, tags, note) {
    var s = el('div', 'ks'), hh = el('h4');
    hh.appendChild(document.createTextNode(h));
    (tags || []).forEach(function (t) { hh.appendChild(tagEl(t)); });
    s.appendChild(hh); s.appendChild(el('p', null, text));
    if (note) { var n = el('p', 'vn'); n.appendChild(el('b', null, '確認できること　')); n.appendChild(document.createTextNode(note)); s.appendChild(n); }
    return s;
  }
  function stepCard(d, step, body) {
    var card = el('section', 'step');
    var h = el('div', 'sh'); h.appendChild(el('b', null, step.name)); h.appendChild(el('span', null, step.min + '分')); card.appendChild(h);
    body.className = 'sb'; card.appendChild(body);
    var btn = el('button', 'done', step.verb); btn.type = 'button';
    btn.setAttribute('aria-pressed', state.done[d + step.id] ? 'true' : 'false');
    btn.addEventListener('click', function () {
      var k = d + step.id;
      if (state.done[k]) delete state.done[k]; else state.done[k] = 1;
      btn.setAttribute('aria-pressed', state.done[k] ? 'true' : 'false');
      saveNow(); afterChange(d);
    });
    card.appendChild(btn);
    return card;
  }
  function afterChange(d) {
    updateStrip(); updateSummary();
    var st = $('daystate'); if (st) st.hidden = dayCount(d) !== 3;
    var nx = $('nextbtn'); if (nx) nx.className = 'navbtn' + (dayCount(d) === 3 ? ' primary' : '');
  }

  function checkForm(which) {
    var wrap = el('div', 'check');
    wrap.appendChild(el('h4', null, which === 'd1' ? 'はじめの自己チェック（1〜5）' : '30日目の自己チェック（1〜5）'));
    var cur = state.base[which] || { s: {}, n: {} };
    CHECK.forEach(function (c) {
      var ci = el('div', 'ci');
      ci.appendChild(el('div', 'cl', c.t)); ci.appendChild(el('div', 'ch', c.h));
      var sc = el('div', 'scale'); sc.setAttribute('role', 'group'); sc.setAttribute('aria-label', c.t);
      for (var v = 1; v <= 5; v++) {
        (function (v) {
          var b = el('button', null, String(v)); b.type = 'button';
          b.setAttribute('aria-pressed', cur.s[c.k] === v ? 'true' : 'false');
          b.addEventListener('click', function () {
            var o = state.base[which] || (state.base[which] = { s: {}, n: {} });
            if (o.s[c.k] === v) delete o.s[c.k]; else o.s[c.k] = v;
            sc.querySelectorAll('button').forEach(function (x, i) { x.setAttribute('aria-pressed', o.s[c.k] === i + 1 ? 'true' : 'false'); });
            saveNow(); refreshCompare();
          });
          sc.appendChild(b);
        })(v);
      }
      ci.appendChild(sc);
      var lab = el('div', 'scale-l'); lab.appendChild(el('span', null, 'あてはまらない')); lab.appendChild(el('span', null, 'よくあてはまる')); ci.appendChild(lab);
      var inp = el('input'); inp.type = 'text'; inp.id = 'chk-' + which + '-' + c.k; inp.maxLength = 500;
      inp.placeholder = c.k === 'hab' ? (which === 'd1' ? '今続けている・続けたい行動' : 'これから続ける行動') : 'ひとことメモ（任意）';
      inp.setAttribute('aria-label', c.t + 'のメモ');
      inp.value = cur.n[c.k] || '';
      inp.addEventListener('input', function () {
        var o = state.base[which] || (state.base[which] = { s: {}, n: {} });
        if (inp.value.trim()) o.n[c.k] = inp.value; else delete o.n[c.k];
        save(); refreshCompare();
      });
      ci.appendChild(inp);
      wrap.appendChild(ci);
    });
    return wrap;
  }
  function refreshCompare() {
    var box = $('compare'); if (!box) return;
    box.textContent = '';
    var a = state.base.d1, b = state.base.d30;
    if (!a || !b) {
      box.appendChild(el('h4', null, 'Day 1との比較'));
      box.appendChild(el('p', 'empty', !a ? 'Day 1の自己チェックがまだです。Day 1を開いて採点すると、ここで比べられます。' : '上の5つを採点すると、Day 1との変化がここに出ます。'));
      return;
    }
    box.appendChild(el('h4', null, 'Day 1との比較'));
    CHECK.forEach(function (c) {
      var x = a.s[c.k], y = b.s[c.k], row = el('div', 'cmp'), top = el('div', 'top');
      top.appendChild(el('span', null, c.t));
      var dl = el('span', 'delta');
      if (x && y) { var df = y - x; dl.textContent = (x + ' → ' + y) + (df ? '（' + (df > 0 ? '+' : '') + df + '）' : '（変化なし）'); if (df > 0) dl.className += ' up'; if (df < 0) dl.className += ' down'; }
      else dl.textContent = (x || '−') + ' → ' + (y || '−');
      top.appendChild(dl); row.appendChild(top);
      var rows = el('div', 'rows');
      [['Day 1', x, ''], ['Day 30', y, ' now']].forEach(function (r) {
        rows.appendChild(el('span', null, r[0]));
        var mb = el('div', 'mb' + r[2]), i = el('i'); i.style.width = (r[1] ? r[1] * 20 : 0) + '%'; mb.appendChild(i); rows.appendChild(mb);
        rows.appendChild(el('span', null, r[1] ? String(r[1]) : '−'));
      });
      row.appendChild(rows);
      if (a.n[c.k] || b.n[c.k]) {
        var nts = el('div', 'nts');
        if (a.n[c.k]) nts.appendChild(el('p', null, 'Day 1：' + a.n[c.k]));
        if (b.n[c.k]) nts.appendChild(el('p', null, 'Day 30：' + b.n[c.k]));
        row.appendChild(nts);
      }
      box.appendChild(row);
    });
    var cnt = 0; for (var d = 1; d <= 30; d++) if (hasRefl(d)) cnt++;
    box.appendChild(el('p', 'empty', '30日間で内省を書いた日：' + cnt + '日'));
  }

  function renderDay() {
    var d = sel, D = DAYS[d - 1], root = $('day');
    root.textContent = '';
    var head = el('div', 'dayhead');
    head.appendChild(el('p', 'phase', PH[D.ph][0] + '　' + PH[D.ph][1]));
    head.appendChild(el('h2', null, 'Day ' + d + '　' + D.t));
    var st = el('p', 'state', 'この日は完了です'); st.id = 'daystate'; st.hidden = dayCount(d) !== 3; head.appendChild(st);
    var n = dayNumber();
    if (state.start && d > n) head.appendChild(el('p', 'future', 'まだ先の日です。読んでもかまいませんが、順番に進めるのがおすすめです。'));
    root.appendChild(head);

    var kb = el('div');
    var used = {}; (D.mt || []).concat(D.vt || []).forEach(function (t) { used[t] = 1; });
    var lg = el('div', 'legend'); ['sci', 'hist', 'view', 'chk'].forEach(function (t) { if (used[t]) lg.appendChild(tagEl(t)); });
    kb.appendChild(lg);
    kb.appendChild(kSection('基礎', D.b));
    kb.appendChild(kSection('仕組み', D.m, D.mt));
    kb.appendChild(kSection('講師の考え', D.v, D.vt, D.vn));
    kb.appendChild(kSection('身近な例', D.e));
    root.appendChild(stepCard(d, STEPS[0], kb));

    var ab = el('div'); ab.appendChild(el('p', null, D.a));
    if (d === 1) ab.appendChild(checkForm('d1'));
    if (d === 30) { ab.appendChild(checkForm('d30')); var cp = el('div', 'compare'); cp.id = 'compare'; ab.appendChild(cp); }
    root.appendChild(stepCard(d, STEPS[1], ab));
    if (d === 30) refreshCompare();

    var rb = el('div'); rb.appendChild(el('p', 'ask', '今日の問い：' + D.r));
    var cur = state.refl[d] || {};
    REFL.forEach(function (f, i) {
      var fw = el('div', 'field');
      var lab = el('label', null, (i + 1) + '. ' + f.t); lab.htmlFor = 'refl-' + d + '-' + f.k;
      lab.appendChild(el('small', null, f.h)); fw.appendChild(lab);
      var ta = el('textarea'); ta.id = 'refl-' + d + '-' + f.k; ta.rows = 2; ta.maxLength = 4000;
      ta.value = cur[f.k] || '';
      ta.addEventListener('input', function () {
        var r = state.refl[d] || (state.refl[d] = { g: '', c: '', n: '' });
        r[f.k] = ta.value;
        if (!hasRefl(d)) delete state.refl[d];
        flashSaved(); renderNotes();
      });
      fw.appendChild(ta); rb.appendChild(fw);
    });
    var sv = el('p', 'saved', hasRefl(d) ? '保存済み' : '書いた内容は自動で保存されます。書き終えたら「記録した」を押してください。'); sv.id = 'savedmsg';
    rb.appendChild(sv);
    root.appendChild(stepCard(d, STEPS[2], rb));

    var nav = el('div', 'nav');
    var pv = el('button', 'navbtn', '前の日'); pv.type = 'button'; pv.disabled = d <= 1;
    pv.addEventListener('click', function () { selectDay(d - 1, true); });
    var nx = el('button', 'navbtn' + (dayCount(d) === 3 ? ' primary' : ''), '次の日'); nx.type = 'button'; nx.id = 'nextbtn'; nx.disabled = d >= 30;
    nx.addEventListener('click', function () { selectDay(d + 1, true); });
    nav.appendChild(pv); nav.appendChild(nx); root.appendChild(nav);
  }
  function renderNotes() {
    var box = $('notes'); box.textContent = ''; var any = false;
    for (var d = 30; d >= 1; d--) {
      if (!hasRefl(d)) continue;
      any = true;
      (function (d) {
        var r = state.refl[d], b = el('button', 'note'); b.type = 'button';
        b.appendChild(el('div', 'nh', 'Day ' + d + '　' + DAYS[d - 1].t));
        b.appendChild(el('div', 'nt', r.g || r.c || r.n));
        b.addEventListener('click', function () { selectDay(d, true); });
        box.appendChild(b);
      })(d);
    }
    if (!any) box.appendChild(el('p', 'empty', 'まだありません。内省に書いたことが、ここに並びます。'));
  }
  function selectDay(d, toTop) {
    sel = Math.min(30, Math.max(1, d));
    renderDay(); updateStrip();
    if (toTop) window.scrollTo({ top: 0 });
  }
  function initialDay() {
    var t = todayNum(); if (t) return t;
    for (var d = 1; d <= 30; d++) if (dayCount(d) < 3) return d;
    return 30;
  }
  function renderAll() { updateSummary(); renderNotes(); selectDay(initialDay(), false); }

  /* ---------- バックアップ ---------- */
  function exportText() {
    saveNow();
    return JSON.stringify({ app: 'ningenryoku-30', version: 3, exportedAt: new Date().toISOString(), data: state });
  }
  function msg(t, cls) { var m = $('bmsg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }
  $('exportbtn').addEventListener('click', function () {
    try {
      var blob = new Blob([exportText()], { type: 'application/json' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'ningenryoku30-backup-' + todayStr().replace(/-/g, '') + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      msg('書き出しました。ファイルが見つからないときは「テキストでコピー」を使ってください。', 'ok');
    } catch (e) { msg('書き出せませんでした。「テキストでコピー」を使ってください。', 'err'); }
  });
  $('copybtn').addEventListener('click', function () {
    var t = exportText(), box = $('copybox');
    box.value = t; box.hidden = false;
    function fallback() { box.focus(); box.select(); msg('テキストを選択しました。コピーして、メモアプリなどに保存してください。', ''); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { msg('コピーしました。メモアプリなどに貼り付けて保存してください。', 'ok'); }, fallback);
    } else fallback();
  });
  function stats(s) {
    var steps = Object.keys(s.done).length, refl = Object.keys(s.refl).length, maxd = 0;
    Object.keys(s.done).forEach(function (k) { maxd = Math.max(maxd, parseInt(k, 10)); });
    Object.keys(s.refl).forEach(function (k) { maxd = Math.max(maxd, +k); });
    return [['開始日', s.start || '未スタート'], ['完了ステップ', steps + ' / 90'], ['最後に記録した日', maxd ? 'Day ' + maxd : 'なし'], ['内省を書いた日', refl + '日'], ['自己チェック', (s.base.d1 ? 'Day 1 あり' : 'Day 1 なし') + '・' + (s.base.d30 ? 'Day 30 あり' : 'Day 30 なし')]];
  }
  function readBackup(text) {
    $('preview').hidden = true; pending = null;
    var o;
    try { o = JSON.parse(text); } catch (e) { msg('読み込めませんでした。このアプリで書き出したテキストではありません。', 'err'); return; }
    if (!o || o.app !== 'ningenryoku-30' || typeof o.version !== 'number' || o.version > 3 || !o.data) { msg('このアプリのバックアップではないため、読み込みませんでした。', 'err'); return; }
    var s = sanitize(o.data);
    if (!s) { msg('データの形が正しくないため、読み込みませんでした。今の記録はそのままです。', 'err'); return; }
    pending = s;
    var dl = $('pvlist'); dl.textContent = '';
    stats(s).forEach(function (r) { dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1])); });
    if (o.exportedAt && !isNaN(new Date(o.exportedAt))) { var d = new Date(o.exportedAt); dl.appendChild(el('dt', null, '書き出した日')); dl.appendChild(el('dd', null, d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()))); }
    msg('', ''); $('preview').hidden = false;
    $('preview').scrollIntoView({ block: 'nearest' });
  }
  $('importfile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    if (f.size > 2000000) { msg('ファイルが大きすぎます。このアプリのバックアップか確認してください。', 'err'); return; }
    var fr = new FileReader();
    fr.onload = function () { readBackup(String(fr.result)); };
    fr.onerror = function () { msg('ファイルを開けませんでした。', 'err'); };
    fr.readAsText(f);
  });
  $('pastebtn').addEventListener('click', function () { $('pastearea').hidden = !$('pastearea').hidden; if (!$('pastearea').hidden) $('pastebox').focus(); });
  $('pastego').addEventListener('click', function () {
    var t = $('pastebox').value.trim();
    if (!t) { msg('テキストを貼り付けてから押してください。', 'err'); return; }
    if (t.length > 2000000) { msg('テキストが長すぎます。', 'err'); return; }
    readBackup(t);
  });
  $('restoreno').addEventListener('click', function () { pending = null; $('preview').hidden = true; msg('復元をやめました。今の記録はそのままです。', ''); });
  $('restoreyes').addEventListener('click', function () {
    if (!pending) return;
    state = pending; pending = null; $('preview').hidden = true;
    $('pastebox').value = ''; $('pastearea').hidden = true;
    var ok = saveNow();
    msg(ok ? '復元しました。' : '復元しましたが、保存できませんでした。', ok ? 'ok' : 'err');
    renderAll();
  });

  /* ---------- その他 ---------- */
  $('startbtn').addEventListener('click', function () { state.start = todayStr(); saveNow(); updateSummary(); selectDay(1, true); });
  $('resetbtn').addEventListener('click', function () { $('resetbtn').hidden = true; $('resetconfirm').hidden = false; });
  $('resetno').addEventListener('click', function () { $('resetconfirm').hidden = true; $('resetbtn').hidden = false; });
  $('resetyes').addEventListener('click', function () {
    state = blank(); $('resetconfirm').hidden = true; $('resetbtn').hidden = false;
    saveNow(); renderAll(); window.scrollTo({ top: 0 });
  });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });

  if (typeof DAYS === 'undefined' || DAYS.length !== 30) { $('day').textContent = '教材データを読み込めませんでした。再読み込みしてください。'; return; }
  load(); buildStrip(); renderAll();
  if (!storageOk) $('fnote').textContent = 'この環境では保存できません。ブラウザの設定を確認してください。';
})();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
